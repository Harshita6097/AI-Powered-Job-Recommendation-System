<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Job Recommender</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 2rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .logo p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .tabs {
      display: flex;
      background: #1e2130;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.8rem;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      color: #94a3b8;
      transition: all 0.2s;
    }

    .tab.active {
      background: #6366f1;
      color: #fff;
      font-weight: 600;
    }

    .card {
      background: #1e2130;
      border-radius: 14px;
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    select, input, textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: #6366f1;
    }

    textarea { resize: vertical; min-height: 90px; }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover { background: #4f46e5; }

    .panel { display: none; }
    .panel.active { display: block; }

    .hint {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🎯 Job Recommender</h1>
      <p>AI-powered matching using collaborative &amp; content-based filtering</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('existing')">Existing User</div>
      <div class="tab" onclick="switchTab('new')">New User</div>
    </div>

    <div class="card">
      <!-- Existing user panel -->
      <div class="panel active" id="panel-existing">
        <div class="form-group">
          <label>Select your User ID</label>
          <select id="user-select">
            <option value="">Loading users...</option>
          </select>
          <p class="hint">Uses hybrid SVD + content-based filtering</p>
        </div>
        <div class="form-group">
          <label>Number of recommendations</label>
          <input type="number" id="topk-existing" value="8" min="1" max="20"/>
        </div>
        <button class="btn" onclick="getRecommendations('existing')">Get Recommendations →</button>
      </div>

      <!-- New user / cold start panel -->
      <div class="panel" id="panel-new">
        <div class="form-group">
          <label>Your Skills</label>
          <textarea id="skills-input" placeholder="e.g. Python, Machine Learning, SQL, Data Analysis"></textarea>
          <p class="hint">Cold-start: uses content-based filtering on your skills</p>
        </div>
        <div class="form-group">
          <label>Number of recommendations</label>
          <input type="number" id="topk-new" value="8" min="1" max="20"/>
        </div>
        <button class="btn" onclick="getRecommendations('new')">Get Recommendations →</button>
      </div>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";

    async function loadUsers() {
      const res = await fetch(`${API}/api/users`);
      const data = await res.json();
      const sel = document.getElementById("user-select");
      sel.innerHTML = data.map(u =>
        `<option value="${u.user_id}">${u.user_id} — ${u.user_skills}</option>`
      ).join("");
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach((t, i) => {
        t.classList.toggle("active", (i === 0 && tab === "existing") || (i === 1 && tab === "new"));
      });
      document.getElementById("panel-existing").classList.toggle("active", tab === "existing");
      document.getElementById("panel-new").classList.toggle("active", tab === "new");
    }

    async function getRecommendations(mode) {
      let body = {};
      if (mode === "existing") {
        const uid = document.getElementById("user-select").value;
        if (!uid) return alert("Please select a user.");
        body = { user_id: uid, top_k: parseInt(document.getElementById("topk-existing").value) };
      } else {
        const skills = document.getElementById("skills-input").value.trim();
        if (!skills) return alert("Please enter your skills.");
        body = { user_skills: skills, top_k: parseInt(document.getElementById("topk-new").value) };
      }

      const res = await fetch(`${API}/api/recommend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      sessionStorage.setItem("recommendations", JSON.stringify(data));
      sessionStorage.setItem("query", JSON.stringify(body));
      window.location.href = "/static/recommendations.html";
    }

    loadUsers();
  </script>
</body>
</html>
